apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: QQGroupContext
  version: 0.1.3
  label:
    en_US: QQ Group Conversation Context
    zh_Hans: QQ 群聊前文与多图理解
  description:
    en_US: On-demand recent group discussion and image understanding across participants.
    zh_Hans: 按需理解同群不同成员的近期讨论和图片，自然接续话题。
  icon: assets/icon.svg
spec:
  config:
    - name: model_uuid
      type: string
      required: true
      default: ''
      label:
        en_US: Vision model UUID
        zh_Hans: 图片理解模型 UUID
      description:
        en_US: Uses the existing LangBot model provider and credentials.
        zh_Hans: 使用已配置的 LangBot 模型与密钥，不重复填写密钥。
  components:
    Tool:
      fromDirs:
        - path: components/tools/
    EventListener:
      fromDirs:
        - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: QQGroupContext
