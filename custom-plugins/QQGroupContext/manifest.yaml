apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: QQGroupContext
  version: 0.3.0
  label:
    en_US: QQ Group Conversation Context
    zh_Hans: QQ 互动、管理与群聊上下文
  description:
    en_US: On-demand recent group discussion and image understanding across participants.
    zh_Hans: 按语境选择 QQ 互动、群管理、文件与媒体能力，查询成员、头像和群聊前文。
  icon: assets/icon.svg
spec:
  config:
    - name: vision_enabled
      type: boolean
      required: false
      default: true
      label: {en_US: Enable image understanding, zh_Hans: 启用图像理解}
      description: {en_US: QQ tools remain available independently, zh_Hans: 与管理页图像理解开关联动，关闭不影响 QQ 互动工具。}
    - name: model_uuid
      type: string
      required: true
      default: ''
      label:
        en_US: Vision model UUID
        zh_Hans: 图片理解模型 UUID
      description:
        en_US: Uses the existing LangBot model provider and credentials.
        zh_Hans: 使用已配置的 LangBot 模型与密钥，不重复填写密钥。
    - name: history_hours
      type: integer
      required: false
      default: 24
      label:
        en_US: History lookback hours
        zh_Hans: 群聊回看时长（小时）
      description:
        en_US: 1–168 hours before the current question; not a permanent archive.
        zh_Hans: 允许1–168小时，默认24小时；仅按需读取，不永久归档。
    - name: history_max_messages
      type: integer
      required: false
      default: 1000
      label:
        en_US: History scan limit
        zh_Hans: 群聊最多扫描条数
      description:
        en_US: 100–1000 messages; model results are paginated separately.
        zh_Hans: 允许100–1000条，默认1000条；分批交给模型，不一次塞入全部历史。
  components:
    Tool:
      fromDirs:
        - path: components/tools/
    EventListener:
      fromDirs:
        - path: components/event_listener/
execution:
  python:
    path: main.py
    attr: QQGroupContext
