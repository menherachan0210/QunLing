apiVersion: v1
kind: Tool
metadata:
  name: edit_image
  label:
    en_US: Edit an image
    zh_Hans: 修改图片
  description:
    en_US: Edit or combine one to four query-bound reference images and send one result.
    zh_Hans: 修改或组合本轮选定的1至4张参考图片，也可画出多帧动作并合成 GIF。
spec:
  parameters:
    type: object
    properties:
      prompt:
        type: string
        minLength: 1
        maxLength: 8000
        description: Requested changes; for multiple references describe image 1, image 2 etc. in image_refs order.
      image_refs:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
        description: Optional exact edit_ref_ values from this query's list_edit_image_references or current image prompt.
      gif_frames:
        type: array
        minItems: 2
        maxItems: 6
        items:
          type: string
          minLength: 1
          maxLength: 300
        description: Optional ordered descriptions of 2–6 new poses using the selected references; one storyboard is split into frames and assembled as a GIF.
      asset_refs:
        type: array
        minItems: 1
        maxItems: 4
        uniqueItems: true
        items:
          type: string
        description: Shared asset_ref values from web collection, file tools, group imports or earlier outputs. Mutually exclusive with image_refs.
      deliver:
        type: boolean
        default: true
        description: Set false for intermediate images/GIFs; returns shared asset_refs without sending to QQ. Deliver only the final requested artifact.
      frame_duration_ms:
        type: integer
        minimum: 100
        maximum: 1500
        default: 350
        description: Hold time per frame; only with gif_frames.
    required:
      - prompt
    additionalProperties: false
  llm_prompt: |
    Edit or combine one to four EXISTING reference images and send one result to the current conversation.
    Infer the user's intent from natural language; no fixed trigger word is required.
    Use when the user requests a change to an existing image, for example a different
    background, color, style, or object, or a follow-up revision to a recently generated image.
    Do not use for merely describing, recognizing, analyzing or reading text in an image.
    Do not call for a hypothetical request or your own example or suggestion.
    Pass the requested changes as prompt, at most 8000 characters. Never provide
    image URLs, image bytes, account IDs, recipients, credentials, or model names.
    With image_refs, use only exact edit_ref_ values listed in THIS query by
    list_edit_image_references or its current-image prompt. Other tools' img_ references
    are incompatible. For prior group images including another member's uploads, list references first.
    For multiple references preserve their order and specify requested changes per image.
    Alternatively pass asset_refs returned by web/file/GIF tools; these carry actual
    saved image bytes, not URLs. Never combine asset_refs and image_refs in one call.
    If the edited image is an intermediate for another tool, set deliver=false.
    It returns shared asset_refs for file/GIF/ZIP tools without posting intermediate
    results. Default deliver=true sends the result as usual. Do not regenerate to obtain a reference.
    Animated references are read as chronological sampled keyframes, not full video.
    To replace a character in an existing GIF, inspect its sampled motion, then use
    gif_frames to preserve the action across 2–6 poses. Without gif_frames the result is a still.
    A clear request to combine two pictures or swap their characters' clothing is supported
    without making the user create a collage. If the objects are ambiguous, ask which pictures.
    Without image_refs, legacy single-image selection uses the current or quoted image,
    otherwise this sender's latest upload or delivered plugin image in the same chat within 30 minutes.
    Multiple current images require explicit image_refs, not a forced single-image workflow.
    Do not invent a source image or silently switch to generating a new image when none is available.
    When asked to AI-draw several expressions/poses of this character and make a GIF,
    supply gif_frames in playback order and optional frame_duration_ms. prompt is
    the shared character/style instruction. One paid edit generates a grid of frames;
    code splits and saves the source and each frame, composes the GIF and queues it
    to the original chat. For simple shake/bounce/spin/text applied to existing images
    use gif_animation instead. No @ or special command is needed in free dialogue.
    Follow GIF task_id using file_task. queued/started is not confirmed sent; never
    duplicate delivery. Reuse recipe/frame_refs with gif_animation for speed, caption
    or sequence changes. Partial results do not authorize another paid request.
    Generate and edit tools together allow at most one paid request per user message.
    Never retry either tool after an error, timeout, unconfirmed result or delivery failure.
    On success, the image is already sent. Use the current group communication settings for the response; do not emit Markdown image links.
    Reference images are sent to the editing service, but this tool does not
    visually inspect the edited output. Requested changes and instructions to
    retain features are intent, not proof that those details survived in the
    output. You may explain the user's request and cite earlier actual source
    observations, preserving whose image and which stage they describe.
    Do not claim a verified visual comparison of source and result without having
    inspected both. Conversely, missing output pixels in this result does not
    mean the image was never delivered or the source was never seen.
execution:
  python:
    path: edit_image.py
    attr: EditImage
