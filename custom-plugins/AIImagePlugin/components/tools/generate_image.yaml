apiVersion: v1
kind: Tool
metadata:
  name: generate_image
  label:
    en_US: Generate an image
    zh_Hans: 生成图片
  description:
    en_US: Generate a new image or native animated GIF and send it to the current conversation.
    zh_Hans: 按自然语言生成新图或原生 GIF 动图，发回当前会话。
spec:
  parameters:
    type: object
    properties:
      deliver:
        type: boolean
        default: true
        description: Set false to save an intermediate image/GIF as shared asset_refs for later tools without posting it to QQ.
      prompt:
        type: string
        minLength: 1
        maxLength: 8000
        description: The user's requested new image, with its subject, style and composition.
      output_format:
        type: string
        enum: [png, gif]
        default: png
        description: Use gif when the user requests AI-generated motion or a looping animation. Describe motion and loop in prompt. Otherwise use png.
      frame_count:
        type: integer
        minimum: 2
        maximum: 16
        description: Only for GIF. Omit to use the administrator setting (16 frames by default); override only when the user requests a frame count.
      frame_duration_ms:
        type: integer
        minimum: 20
        maximum: 2000
        description: Only for GIF. Omit for the administrator setting (200 ms by default). The provider rounds to 10 ms. Set only for a requested playback speed.
    required:
      - prompt
    additionalProperties: false
  llm_prompt: |
    When the requested image is an intermediate for GIF/ZIP/document processing,
    set deliver=false. It returns shared asset_refs and does not send intermediate
    pictures; use the next tool and deliver the requested final artifact. Default
    deliver=true keeps direct image/GIF delivery. Never regenerate just to obtain a ref.
    Generate exactly one NEW image and send it directly to the current conversation.
    Call only when the user explicitly asks you to create, draw, or generate a new image.
    Interpret natural language intent; no fixed trigger word is required.
    For a requested change to an existing or recent image, use edit_image instead.
    Do not call to recognize, describe, analyze, OCR, or answer questions about an existing image.
    Do not call because you gave an example, proposed an image, or mentioned image generation yourself.
    Do not call for a quoted or hypothetical image-generation request.
    Pass a non-empty prompt of at most 8000 characters. Do not supply account IDs,
    recipients, API credentials, endpoints, model names, or image counts.
    For AI-generated motion, set output_format=gif. In prompt describe the subject,
    motion, camera and desired loop. One paid request returns a complete native GIF.
    Do not ask for a grid, contact sheet or separate frame images. Frame count and
    speed use administrator defaults; override only for a user's explicit preference.
    For an existing character use edit_image with output_format=gif and selected
    references. Describe requested effects, captions and timing in that prompt.
    Reuse the returned asset_ref for inspection, sending or packaging.
    A partial/unconfirmed result never authorizes
    another paid request or a different generation method. Only delivery_status=sent
    confirms delivery; deliver=false saves an intermediate without sending it.
    The tool creates one image request per user message and delivers to its own chat.
    member_image_blocked is an administrator restriction for the real sender.
    Follow the returned reply instruction using the current persona; do not apologize,
    retry, switch format/provider or call edit_image to bypass the restriction.
    Call at most once for the same user message. Do not retry on failure, timeout,
    an unconfirmed result, or delivery failure: another generation could be billed again.
    On success, the image is already delivered. Use the current group communication
    settings for the response; never fabricate an image URL or output a Markdown image link.
    Delivery is not visual verification of the generated pixels. The prompt records
    the requested subject/style/features, not proof that the output contains them.
    You may describe what the user requested and what you asked the image service
    to create. Keep any actual earlier observations of the source image separate
    from output observations; do not deny that an image was sent or that a source
    was previously inspected merely because this result contains no image pixels.
    Do not claim exact retained features or visual quality of the output unless
    its actual pixels have separately been inspected.
execution:
  python:
    path: generate_image.py
    attr: GenerateImage
