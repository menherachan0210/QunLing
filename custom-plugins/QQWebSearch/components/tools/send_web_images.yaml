apiVersion: v1
kind: Tool
metadata:
  name: send_web_images
  label:
    en_US: Send found images
    zh_Hans: 发送搜到的图片
  description:
    en_US: Send one or two verified image refs to the current chat with source attribution.
    zh_Hans: 将本轮已核对的1至2张网上图片及来源发送到当前聊天。
spec:
  parameters:
    type: object
    properties:
      image_refs:
        type: array
        minItems: 1
        maxItems: 2
        uniqueItems: true
        items:
          type: string
        description: Exact image_ref identifiers returned by search_web_images in this query.
    required: [image_refs]
    additionalProperties: false
  llm_prompt: |
    Send existing web images ONLY when the current user requested images to be shown/sent.
    Use one or two exact image_refs from this query's search_web_images result, never URLs or recipients.
    The images and their source links are sent directly to the current conversation.
    On success the images have been delivered. Use the current group communication settings for the response. Do not output Markdown image links or duplicate images.
    A failed or ambiguous send must not be retried. Do not claim delivery unless status is sent.
execution:
  python:
    path: send_web_images.py
    attr: SendWebImages
