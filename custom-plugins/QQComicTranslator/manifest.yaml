apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: QQComicTranslator
  version: 0.2.0
  label:
    en_US: Archived Comics to LabelPlus
    zh_Hans: 压缩包漫画翻译与 LabelPlus 导出
  description:
    en_US: Translate ZIP, RAR and 7z comic images in the background with LabelPlus TXT delivery.
    zh_Hans: 后台翻译 ZIP、RAR、7z 漫画图片，记录文字位置并回传 LabelPlus TXT。
  icon: assets/icon.svg
spec:
  config:
    - name: model_uuid
      type: string
      required: true
      default: ''
      label:
        en_US: Vision model UUID
        zh_Hans: LangBot 视觉模型 UUID
      description:
        en_US: Uses the existing LangBot provider credentials; no duplicated API key.
        zh_Hans: 使用已有 LangBot 模型与密钥，不需要重复填写 API Key。
    - name: seven_zip_path
      type: string
      required: false
      default: ''
      label:
        en_US: Native 7-Zip executable
        zh_Hans: 本机 7-Zip 可执行文件
      description:
        en_US: Administrator configured native 7z or 7zz path; empty uses system PATH. Not a model parameter.
        zh_Hans: 管理员配置 Windows 7z.exe 或 Linux 7zz 路径；留空使用系统 PATH。
  components:
    Tool:
      fromDirs:
        - path: components/tools/
    EventListener:
      fromDirs:
        - path: components/event_listener/
    Runner:
      fromDirs:
        - path: components/runners/
execution:
  python:
    path: main.py
    attr: QQComicTranslator
