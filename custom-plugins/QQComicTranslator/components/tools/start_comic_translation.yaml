apiVersion: v1
kind: Tool
metadata:
  name: start_comic_translation
  label:
    en_US: start_comic_translation
    zh_Hans: 开始压缩包漫画翻译
  description:
    en_US: Start translation of a current, quoted, or recent ZIP, RAR or 7z comic archive into Simplified Chinese LabelPlus TXT.
    zh_Hans: 翻译 ZIP、RAR、7z 漫画压缩包；只操作本会话当前发送者的任务。
spec:
  parameters:
    type: object
    properties:
      password:
        type: string
        minLength: 1
        maxLength: 1024
        description: Password explicitly provided by the user for this archive; never guess or echo it.
    additionalProperties: false
  llm_prompt: |
    Start translation of a current, quoted, or recent ZIP, RAR or 7z comic archive (CBZ/CBR aliases supported) into Simplified Chinese LabelPlus TXT. Use only when the user explicitly requests translation of the archive images. This starts a bounded background job and returns promptly; it is NOT completion. No fixed trigger phrase. Do not use for generating/editing images or reading TXT. The tool resolves sender/conversation/files itself. Completed pages are checkpointed. A finished job will send a real TXT file automatically. Do not invent links, claim completion from queued/running, or repeatedly call start. A same-archive task is deduplicated. 40 MiB archive, 100 image pages maximum. Encrypted ZIP (ZipCrypto/AES), RAR and 7z are supported with the user's password. Multipart and self-extracting executables are unsupported.
    Call with {} or {password: user-provided-password}; never pass URLs, paths, identities, recipients, or file IDs. When awaiting_password, the original encrypted bytes are retained. Ask for the password; once supplied use resume_comic_translation with password without asking for reupload or another confirmation. Never repeat the password in replies.
execution:
  python:
    path: start_comic_translation.py
    attr: StartComicTranslation
