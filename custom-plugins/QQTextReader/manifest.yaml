apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: QQTextReader
  version: 0.1.0
  description:
    en_US: Read bounded TXT attachments in the same QQ conversation without a sandbox.
    zh_Hans: 无需沙箱，安全读取同一 QQ 会话中用户上传的有界 TXT 附件。
  label:
    en_US: QQ TXT Reader
    zh_Hans: QQ TXT 阅读器
  icon: assets/icon.svg
spec:
  config: []
  components:
    Tool:
      fromDirs:
        - path: components/tools/
    EventListener:
      fromDirs:
        - path: components/event_listener/
    Runner:
      fromDirs:
        - path: components/runners/
execution:
  python:
    path: main.py
    attr: QQTextReader
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
