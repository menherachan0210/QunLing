apiVersion: v1
kind: Plugin
metadata:
  author: local
  name: QQTextReader
  version: 0.3.0
  description:
    en_US: Scoped document reading, archive navigation, durable processing and file delivery.
    zh_Hans: 统一附件阅读、压缩包导航、持久文件处理与可靠回传。
  label:
    en_US: QQ File Workspace
    zh_Hans: QQ 文件工作区
  icon: assets/icon.svg
spec:
  config: []
  components:
    Tool:
      fromDirs:
        - path: components/tools/
    EventListener:
      fromDirs:
        - path: components/event_listener/
    Runner:
      fromDirs:
        - path: components/runners/
execution:
  python:
    path: main.py
    attr: QQTextReader
  sharedRuntime: shared-runtime-v1
  componentModel: stateless-v1
