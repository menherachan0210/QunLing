name: Public deployment checks

on:
  push:
    branches: [main, master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: public-deployment-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  public-tests:
    name: Public source and setup tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.12"
      - name: Install public test and document parser dependencies
        run: python -m pip install pytest pytest-asyncio jsonschema PyYAML requests qrcode Pillow aiohttp httpx tzdata -r qunling/requirements.txt
      - name: Require JavaScript runtime for console interaction tests
        # ubuntu-24.04 provides Node; fail visibly instead of silently skipping
        # the actual console script's authorization and conflict regressions.
        run: node --version
      - name: Build the management console and verify committed assets
        run: |
          npm ci --prefix frontend
          npm run build --prefix frontend
          git diff --exit-code -- bootstrap/web
          test -z "$(git ls-files --others --exclude-standard bootstrap/web)"
      - name: Exercise management flows in Chromium
        working-directory: frontend
        run: |
          npx playwright install --with-deps chromium
          npm test
      - name: Check publishable files for private runtime state and credentials
        run: python scripts/Check-Release.py
      - name: Test public setup, files, tasks and fixed-source patches without the SDK
        # Dependency-based exclusion only; the real image runs every root test.
        run: python -m pytest tests --public-only -q

  linux-compose:
    name: Linux image and fresh initialization
    needs: public-tests
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    permissions:
      contents: read
      packages: write
    env:
      COMPOSE_PROJECT_NAME: qqbot-ci-${{ github.run_id }}-${{ github.run_attempt }}
      COMPOSE_FILE: deploy/compose/compose.yaml
      # A build record can include logs; the console is sufficient for this job.
      DOCKER_BUILD_RECORD_UPLOAD: "false"
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803 # v6
        with:
          persist-credentials: false
      - name: Validate Compose configuration
        run: docker compose config --quiet
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4
      - name: Build and load the actual Linux image
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/compose/Dockerfile
          platforms: linux/amd64
          tags: qq-ai-bot-local:4.11.0
          build-args: QQBOT_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          push: false
          cache-from: type=gha,scope=qqbot-linux-amd64
          cache-to: type=gha,scope=qqbot-linux-amd64,mode=min
      - name: Download test-only wheels for the isolated image checks
        run: >-
          python -m pip download --only-binary=:all:
          --dest "$RUNNER_TEMP/qunling-test-wheels" pytest pytest-asyncio jsonschema
      - name: Test actual SDK, proactive bridge, file worker and plugins without network access
        timeout-minutes: 15
        run: |
          docker run --rm --network none \
            --entrypoint /bin/sh \
            --mount "type=bind,source=$PWD,target=/workspace,readonly" \
            --mount "type=bind,source=$RUNNER_TEMP/qunling-test-wheels,target=/wheels,readonly" \
            -e PYTHONPATH=/workspace \
            -e QUNLING_DATA_DIR=/tmp/qunling-ci \
            -e QQCOMIC_TEST_7Z=/usr/local/bin/7zz \
            -e QUNLING_TEST_7ZIP=/usr/local/bin/7zz \
            qq-ai-bot-local:4.11.0 -ec '
              uv pip install --python "$VIRTUAL_ENV/bin/python" --no-index --find-links=/wheels pytest pytest-asyncio jsonschema
              cd /workspace
              python -m pytest tests -q -p no:cacheprovider
              python -m qunling.daemon --once
              for plugin in QQTextReader QQGroupContext QQWebSearch QQComicTranslator AIImagePlugin LongTermMemory; do
                cd "/workspace/custom-plugins/$plugin"
                PYTHONPATH="$PWD:/workspace" python -m pytest tests -q -p no:cacheprovider
              done
            '
      - name: Build the separate deployment updater
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7
        with:
          context: .
          file: deploy/updater/Dockerfile
          platforms: linux/amd64
          tags: qunling-updater:1
          build-args: QQBOT_REVISION=${{ github.sha }}
          labels: org.opencontainers.image.source=https://github.com/${{ github.repository }}
          load: true
          push: false
          cache-from: type=gha,scope=qunling-updater
          cache-to: type=gha,scope=qunling-updater,mode=min
      - name: Verify update and rollback with isolated disposable services
        run: python -m deploy.updater.smoke run --helper-image qunling-updater:1
      - name: Start a fresh deployment
        run: |
          docker compose pull napcat
          docker compose up -d --no-build --wait --wait-timeout 600
      - name: Install plugins and configure fake models without model calls or QQ login
        run: >-
          docker compose exec -T wizard python
          /opt/qq-ai-bot/deploy/compose/smoke.py --timeout 1200 --configure
          --save /tmp/qqbot-compose-smoke.json
      - name: Rerun initialization and restart all persistent services
        run: |
          docker compose run --rm --no-deps init
          docker compose restart app wizard napcat
          docker compose up -d --no-build --no-recreate --wait --wait-timeout 600
      - name: Verify restart preserves credentials, plugins and configured resource IDs
        run: >-
          docker compose exec -T wizard python
          /opt/qq-ai-bot/deploy/compose/smoke.py --timeout 600
          --compare /tmp/qqbot-compose-smoke.json
      - name: Publish the verified images by exact commit
        if: github.event_name != 'pull_request' && github.ref == 'refs/heads/main'
        env:
          GHCR_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          printf '%s' "$GHCR_TOKEN" | docker login ghcr.io --username "$GITHUB_ACTOR" --password-stdin
          image_root="ghcr.io/${GITHUB_REPOSITORY,,}"
          docker tag qq-ai-bot-local:4.11.0 "$image_root-app:$GITHUB_SHA"
          docker tag qunling-updater:1 "$image_root-updater:$GITHUB_SHA"
          docker push "$image_root-app:$GITHUB_SHA"
          docker push "$image_root-updater:$GITHUB_SHA"
          docker image inspect "$image_root-app:$GITHUB_SHA" "$image_root-updater:$GITHUB_SHA" --format '{{join .RepoDigests "\n"}}' >> "$GITHUB_STEP_SUMMARY"
          docker logout ghcr.io
      - name: Report container status without tokens or login QR output
        if: failure()
        run: docker compose ps --all
      - name: Remove this job's temporary containers and volumes
        if: always()
        run: docker compose down --volumes --remove-orphans --timeout 30
